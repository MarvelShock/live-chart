<img id="chart" width="800" height="600" style="background-color: transparent;" />

<script>
  function refreshChart() {
    const img = document.getElementById("chart");
    const baseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR-B0pV5OgbRMGqo1doAJcesVhmDOTcmhhpaQqAlzluQGmC-uQwcUEU3iSjqkX1Tku5-ThDliYq_L7z/pubchart?oid=473830938&format=image";
    img.src = baseUrl + "&t=" + new Date().getTime(); // cache-buster
  }

  refreshChart(); // initial load
  setInterval(refreshChart, 30000); // refresh every 30 seconds
</script>
